name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build scanner
        run: go build -o netscanner.exe ./cmd/scanner

      - name: Build dashboard
        run: go build -o dashboard.exe ./cmd/dashboard

      - name: Build enrich
        run: go build -o enrich.exe ./cmd/enrich

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Regla de oro del proyecto: el repo es solo código. Los resultados
      # de escaneo, la caché geo, las notas y las claves viven en data/
      # (ignorado). Si esto falla, hay datos sensibles en el repo: no
      # se pueden subir IPs, redes, cuentas ni webs de nadie.
      - name: No data files in repo
        run: |
          if git ls-files | grep -Ev '^(cmd|pkg|scripts|docs|\.github|README\.md|LICENSE|Makefile|go\.mod|go\.sum|\.gitignore)$' | grep -E '\.(jsonl|csv|stats|mmdb|log)$|geo-cache|comments\.json|ai_key|tools/|^data/'; then
            echo "::error::Hay archivos de datos/escaneos en el repo. Se sube solo código: move los resultados a data/ (ignorado por git)."
            exit 1
          fi
          echo "OK: sin datos de escaneos en el repo."
