name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build scanner
        run: go build -o netscanner.exe ./cmd/scanner

      - name: Build dashboard
        run: go build -o dashboard.exe ./cmd/dashboard

      - name: Build enrich
        run: go build -o enrich.exe ./cmd/enrich
